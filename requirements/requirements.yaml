id: P001
name: 首页
functional_description: 系统入口页面，提供全站导航、快捷查票、营销展示及服务入口。
ui_description: |
  参考代码路径: src/pages/P001/HomePage.jsx
  页面结构自上而下包含：全局导航栏(Header)、Hero区域(轮播图+快捷查票)、服务图标栏、营销活动区。
  其中全局导航栏由 Header 组件提供（src/components/Header.jsx），在除登录/找回密码页面以外的各业务页面统一复用。
scenarios:
children:
  - id: F001
    name: 导航栏访问
    functional_description: 提供全站通用的顶部导航功能，包含用户登录状态管理、主要功能入口跳转、辅助功能入口及品牌展示。
    ui_description: |
      参考代码路径: src/components/Header.jsx
      导航栏分为三层：
      1. 顶部细条 (Top Bar): 灰色背景，高度较小。左侧为辅助功能（无障碍、语言等），右侧为用户状态区。
      2. 品牌栏 (Brand Bar): 白色背景。左侧为Logo及“中国铁路12306”标识，右侧为站内搜索框。
      3. 主导航栏 (Main Nav Bar): 蓝色背景。横向排列主要业务入口（首页、车票等），支持下拉菜单交互。
    children:
      - id: F001-1
        name: 顶部细条 (Top Bar)
        functional_description: 展示辅助链接和用户个人中心/登录入口。
        ui_description: |
          位于页面最顶端，灰色背景 (.top-bar)。
          左侧包含：无障碍、关怀版、English。
          右侧包含：我的12306、登录/注册（未登录）/“欢迎，[真实姓名]。[退出]”（已登录）。
        scenarios:
          - name: 未登录状态展示
            steps:
              - action: 用户访问网站且本地无有效Token
                expectation: 右侧显示“我的12306”、“登录”、“注册”链接，不显示用户姓名和退出按钮。
              - action: 点击“登录”链接
                expectation: 跳转至 /login 页面。
              - action: 点击“注册”链接
                expectation: 跳转至 /register 页面。
              - action: 点击“我的12306”链接
                expectation: 跳转至 /login 页面。
          - name: 已登录状态展示
            steps:
              - action: 用户登录成功（本地有Token和User信息）
                expectation: 右侧显示“欢迎，[真实姓名]”及“[退出]”按钮；隐藏“登录/注册”链接。
              - action: 点击“我的12306”
                expectation: 跳转至 /my 个人中心页面。
          - name: 用户退出登录
            steps:
              - action: 点击“[退出]”按钮
                expectation: 清除本地Token和用户信息，触发状态更新事件，跳转回首页并恢复未登录状态展示。
          - name: 辅助链接点击
            steps:
              - action: 点击“English”
                expectation: 切换语言（目前仅作UI展示，不实现相应功能，也无需接口）。
      - id: F001-2
        name: 品牌栏 (Brand Bar)
        functional_description: 展示品牌标识和全局搜索。
        ui_description: |
          位于Top Bar下方，白色背景 (.brand-bar)。
          包含Logo图片和搜索输入框。
        scenarios:
          - name: 点击Logo
            steps:
              - action: 点击Logo区域
                expectation: 跳转至首页 (/)。
      - id: F001-3
        name: 主导航栏 (Main Nav Bar)
        functional_description: 提供核心业务功能的快速入口。
        ui_description: |
          位于Brand Bar下方，蓝色背景 (.main-nav-bar)。
          菜单项包括：首页、车票、团购服务、会员服务、站车服务、商旅服务、出行指南、信息查询。
          其中“车票”菜单支持展开下拉选择框（如单程购票、往返购票等），目前仅规划“单程-购买”用于跳转车票购买页，其余子项暂作为占位展示。
        scenarios:
          - name: 业务跳转-首页
            steps:
              - action: 点击“首页”
                expectation: 立即跳转至首页 (/)。
          - name: 业务跳转-车票菜单
            steps:
              - action: 将鼠标移动到或点击“车票”菜单
                expectation: 在“车票”菜单下方展开下拉选择框，显示如“单程-购买”、“往返-购买”、“中转服务”、“退改签”等子项。
              - action: 点击“单程-购买”子项
                expectation: 跳转至车票查询/购买页 (/search，对应 P002)，后续查询与购票流程由相关页面功能定义。
              - action: 点击“往返-购买”等其他子项
                expectation: 目前仅作UI展示，点击不触发实际业务跳转，不调用后端接口。
          - name: 其他菜单占位展示
            steps:
              - action: 将鼠标移动到或点击“团购服务”“会员服务”“站车服务”“商旅服务”“出行指南”“信息查询”等菜单或其下拉项
                expectation: 目前仅作UI展示，菜单及下拉内容不可触发实际业务逻辑或接口调用。

  - id: F002
    name: 快捷车票查询
    functional_description: 首页首屏左侧的快速查票组件，支持行程信息设置与查询跳转。
    ui_description: |
      参考代码路径: src/pages/P001/HomePage.jsx
      位于Hero Banner左侧的悬浮卡片 (.search-card)。
      顶部为Tab切换（单程/往返/中转/退改签）。
      主体为表单区域，包含出发地/目的地输入、日期选择、乘客类型与车次类型筛选。
      底部为全宽橙色“查询”按钮。
    scenarios:
      - name: 正常提交查询
        steps:
          - action: 页面加载
            expectation: 默认选中“单程”Tab，日期默认为今日。
          - action: 通过出发地选择 (F002-1) 设置出发站
            expectation: 出发地输入框显示所选城市（具体交互见 F002-1）。
          - action: 通过目的地选择 (F002-1) 设置到达站
            expectation: 目的地输入框显示所选城市（具体交互见 F002-1）。
          - action: 通过日期选择 (F002-2) 设置合法出发日期
            expectation: 日期输入框显示未来15天内的某一日期（具体交互见 F002-2）。
          - action: 根据需要勾选乘客类型和车次类型筛选
            expectation: 表单信息完整且“查询”按钮处于可点击状态。
          - action: 点击“查询”按钮
            expectation: 跳转至 /search 页面，URL或State中携带查询参数（from=北京, to=上海, date=..., isHighSpeed=true）。
      - name: 异常-缺少必填项
        steps:
          - action: 缺少出发地或目的地
          - action: 点击“查询”按钮
            expectation: 界面提示“请输入出发地和目的地”，不发生跳转。
          - action: 缺少日期
            expectation: 界面提示“请选择出发日期”，不发生跳转。
    children:
      - id: F002-1
        name: 站名输入与互换
        functional_description: 出发地和目的地的输入与快速互换。
        ui_description: |
          两个文本输入框，中间包含一个互换图标 (.swap-icon)。
          输入框聚焦时弹出城市选择面板 (StationDropdown)。
        scenarios:
          - name: 城市选择
            steps:
              - action: 聚焦“出发地”输入框
                expectation: 弹出城市选择面板，支持热门城市与字母索引切换。
              - action: 选择面板中的城市
                expectation: 城市名称填入输入框，面板关闭。
          - name: 站名互换
            steps:
              - action: 点击中间的互换图标
                expectation: 出发地与目的地的内容互换。
      - id: F002-2
        name: 日期与筛选
        functional_description: 设置出发日期及附加筛选条件。
        ui_description: |
          日期选择器 (input type="date")，限制最小日期为今日，最大日期为15天后。
          复选框：学生、高铁/动车。
        scenarios:
          - name: 日期限制
            steps:
              - action: 点击日期选择器
                expectation: 仅可选择未来15天内的日期，过去日期不可选。

id: P002
name: 车票查询页
functional_description: 根据行程信息查询车次并展示结果，支持高级筛选与预订入口。
ui_description: |
  参考代码路径: src/pages/P002/SearchResultsPage.jsx
  页面顶部复用全局导航栏 Header 组件（src/components/Header.jsx，详见 P001.F001）。
  页面整体分为上下两部分：
  1. 顶部查询条件区域：包含行程信息、日期选择、横向日期导航及高级筛选。
  2. 底部车次列表区域：以表格形式展示车次信息及余票情况，并提供预订按钮。
scenarios:
  - name: 首次进入页面
    steps:
      - action: 用户从首页(P001)快捷查询或导航栏“车票”入口跳转至本页
        expectation: 查询条件区域根据传入参数初始化出发地、目的地、日期及筛选条件；若无参数则默认出发日为今日。
      - action: 页面加载完成
        expectation: 展示查询条件区域与车次列表区域，若存在历史查询缓存则优先使用缓存数据初始化列表。
children:
  - id: F003
    name: 车票查询
    functional_description: 接收用户输入的行程信息和筛选条件，校验必填项后向后端发起查询请求，并在加载完成后更新车次列表。
    ui_description: |
      顶部查询条件区域包含：
      - 行程信息：出发地、目的地输入框及一键互换按钮。
      - 日期选择：日期输入框 + 横向日期导航栏（7 项，可左右箭头切换窗口）。
      - 乘客与车次类型：普通/学生、车次类型复选框（高铁/动车等）。
      - 时间与站点筛选：出发时间段、到达站/出发站多选筛选。
      - 操作：橙色“查询”按钮。
    scenarios:
      - name: 正常提交查询
        steps:
          - action: 通过出发地/目的地输入 (F003-1) 设置出发站和到达站
            expectation: 出发地与目的地输入框分别显示所选城市（具体交互见 F003-1）。
          - action: 通过日期与横向导航 (F003-2) 设置合法出发日期
            expectation: 日期输入框显示未来15天内的某一日期（具体交互见 F003-2）。
          - action: 通过高级筛选条件 (F003-3) 勾选需要的车次类型、时间段、席别或站点（可选）
            expectation: 查询条件区域展示当前生效的高级筛选标签（具体交互见 F003-3）。
          - action: 点击“查询”按钮
            expectation: 查询按钮进入加载状态，禁用重复点击；顶部条件保持当前值不变，并向后端发起查询请求。
          - action: 后端返回查询结果
            expectation: 车次列表区域刷新为最新结果，并清除加载状态。
      - name: 必填项校验
        steps:
          - action: 仅通过出发地/目的地输入 (F003-1) 设置出发站，未设置到达站
            expectation: 点击“查询”按钮时，页面提示“请输入出发地和目的地”或等效错误信息，不触发查询请求。
          - action: 设置出发地和目的地，但未通过日期选择 (F003-2) 设置出发日期
            expectation: 系统在必要时自动将日期设置为今天并进行校验，若实现为必选项则提示“请选择出发日期”，不触发查询请求。
      - name: 查询参数缓存与返回
        steps:
          - action: 在本页完成一次查询后，通过预订流程或导航跳转到其它页面
            expectation: 当前查询条件（出发地、目的地、日期、主要筛选条件）被缓存。
          - action: 用户再次通过“车票”入口返回本页
            expectation: 查询条件区域自动恢复上次查询的出发地、目的地、日期与筛选条件，车次列表展示上次查询结果或重新发起查询。
      - name: 高级筛选对结果的影响
        steps:
          - action: 在已有查询结果的情况下，通过高级筛选条件 (F003-3) 调整车次类型、时间段、席别或车站
            expectation: 车次列表实时根据当前选中的高级筛选条件进行过滤，仅展示满足条件的车次，无需再次点击“查询”按钮。
    children:
      - id: F003-1
        name: 出发地/目的地输入与互换
        functional_description: 提供带热门城市与拼音索引的站点选择组件，支持快速互换出发地与目的地。
        ui_description: |
          - 两个文本输入框分别用于出发地与目的地。
          - 中间提供互换图标按钮，点击后互换两侧输入内容。
          - 输入框聚焦时弹出城市选择面板，支持热门城市与拼音索引切换。
        scenarios:
          - name: 城市选择
            steps:
              - action: 聚焦“出发地”或“目的地”输入框
                expectation: 下方弹出常用城市选择面板，显示热门城市及拼音索引。
              - action: 在面板中点击某个城市
                expectation: 对应输入框填入该城市名称，城市面板关闭。
          - name: 站名互换
            steps:
              - action: 已分别选择出发地和目的地
                expectation: 输入框中显示两个不同城市。
              - action: 点击中间的互换按钮
                expectation: 出发地与目的地的内容互换，其他筛选条件保持不变。
      - id: F003-2
        name: 日期选择与横向导航
        functional_description: 通过日期输入框和横向日期导航栏设置出发日期，限制查询范围为未来15天内。
        ui_description: |
          - 日期输入框 (input type="date")，最小值为今日，最大值为今日+15天。
          - 横向日期导航栏显示连续7天日期，包含星期信息，左右箭头用于切换日期窗口。
        scenarios:
          - name: 日期输入选择
            steps:
              - action: 点击日期输入框
                expectation: 弹出日期选择器，仅可选择今日及之后15天内日期，过去日期不可选。
              - action: 选择一个合法日期
                expectation: 输入框显示该日期，并驱动查询条件更新。
          - name: 横向日期导航点击
            steps:
              - action: 在横向日期导航栏点击某一日期项
                expectation: 当前选中态移动到该日期项，日期输入框同步为对应日期，并触发查询或准备查询。
          - name: 横向日期导航翻页
            steps:
              - action: 点击导航栏右侧箭头
                expectation: 导航栏向后移动一个窗口，继续展示7天连续日期，禁用已过期日期。
              - action: 点击导航栏左侧箭头
                expectation: 若存在更早但仍在可查询范围内的日期，则向前移动窗口；超出范围时箭头禁用。
      - id: F003-3
        name: 高级筛选条件
        functional_description: 提供车次类型、时间段、席别及出发/到达车站的组合筛选能力。
        ui_description: |
          - 车次类型：多选复选框（高铁G、动车D、直达Z、特快T、快速K等）。
          - 时间段：单选或多选时间范围按钮（全时间段、凌晨、上午、下午、晚上）。
          - 席别：勾选“仅显示有票席别”及指定席别类型。
          - 站点：出发站、到达站多选控件。
          - 筛选项依据当前查询结果动态生成，仅展示当前数据中实际存在的车次类型、时间段、席别和站点，不存在的条件不出现在选项中。
        scenarios:
          - name: 车次类型筛选
            steps:
              - action: 勾选“高铁(G)”并取消其他类型
                expectation: 列表仅展示车次号以 G 开头的车次。
          - name: 时间段筛选
            steps:
              - action: 选择“下午 12:00-18:00”
                expectation: 列表仅展示出发时间在 12:00-18:00 的车次。
          - name: 席别筛选
            steps:
              - action: 勾选“仅显示有票席别”
                expectation: 列表仅展示仍有余票的席别，售罄席别被隐藏或标记为不可选。
          - name: 站点筛选
            steps:
              - action: 在出发站/到达站筛选中选择特定站点
                expectation: 列表仅展示经过所选站点的车次。
          - name: 高级筛选面板展开与收起
            steps:
              - action: 点击高级筛选区域右下角的“展开/收起”按钮
                expectation: 高级筛选区域在收起与展开状态之间切换，仅影响筛选区域的展示高度与可见内容，不改变当前已选择的筛选条件。

  - id: F004
    name: 车票展示
    functional_description: 以表格形式展示查询结果中的车次详情、各席别余票情况，并提供预订入口。
    ui_description: |
      - 上方为表头，蓝色背景、白色字体，包含车次、出发/到达站、出发/到达时间、历时、各席别和操作列。
      - 下方为结果列表，每行代表一趟车次，展示车次号、车站、时间、历时以及各席别余票信息。
      - 席别列通常包括商务座、一等座、二等座等商务/动车席别，视实现情况可扩展为硬卧、软卧、硬座等其他席别，每一列对应展示该席别的余票状态。
      - 行尾提供“预订”按钮，点击后进入订单填写流程（F005）。
    scenarios:
      - name: 展示查询结果列表
        steps:
          - action: 完成一次有效查询（F003）
            expectation: 若有结果，列表按默认排序展示所有符合条件的车次；若无结果，则展示“无符合条件车次”提示。
      - name: 列表排序
        steps:
          - action: 点击表头“出发时间”列
            expectation: 出发时间列右侧箭头变为向下橙色填充，列表按出发时间降序排序。
          - action: 再次点击“出发时间”或根据实现切换排序方式
            expectation: 可在升序/降序之间切换或恢复默认排序。
          - action: 点击表头“历时”列
            expectation: 历时列右侧箭头变为向下橙色填充，列表按历时降序排序。
      - name: 席别余票展示
        steps:
          - action: 查询结果中存在多个席别信息
            expectation: 各席别单元格显示"数字"(余票数量)或“无”。
      - name: 未登录点击预订
        steps:
          - action: 在未登录状态下点击某一车次行的“预订”按钮
            expectation: 系统记录当前选中车次及必要信息后，跳转至登录页(P003)，登录成功后可继续预订流程。
      - name: 已登录点击预订
        steps:
          - action: 在已登录状态下点击“预订”按钮
            expectation: 跳转至订单填写页(P005)，并在页面中展示所选车次信息及可选席别。

id: P005
name: 订单填写页
functional_description: 在用户选定车次后展示订单详情，支持席别与乘车人选择，并提交预订请求生成订单。
ui_description: |
  参考代码路径: src/pages/P005/BookingPage.jsx
  页面顶部复用全局导航栏 Header 组件（src/components/Header.jsx，详见 P001.F001）。
  页面整体布局为自上而下三块：
  - 顶部车次信息区域：展示车次号、出发/到达站及时间等关键信息。
  - 中部席别与乘车人区域：选择席别、展示并多选常用乘车人。
  - 底部订单明细与提交区域：展示价格总计与订单概要，并提供“提交订单”等操作按钮。
scenarios:
  - name: 从车票查询页进入
    steps:
      - action: 用户在车票查询页(P002)已登录状态下点击某一行车次的“预订”按钮
        expectation: 跳转至本页(P005)，顶部区域展示所选车次的信息，中部默认选中某个可用席别，右侧或下方展示常用乘车人列表。
      - action: 页面加载完成
        expectation: 若用户已在乘客管理中配置常用乘车人，则在乘车人区域自动列出这些乘车人，订单明细区域显示初始价格信息。
children:
  - id: F007
    name: 订单显示
    functional_description: 展示所选车次信息、可用席别及价格，加载常用乘车人列表，并在界面上汇总订单明细。
    ui_description: |
      - 车次信息：以卡片或区域形式展示车次号、出发站→到达站、出发时间、到达时间和历时等信息。
      - 席别选择：展示二等座、一等座、商务座等席别的余票数量和单价，支持点击选择。
      - 乘车人区域：展示来自个人中心“乘客管理”的常用乘车人列表，可多选。
      - 订单明细区域：展示当前选择的车次、乘车人和总价等概要信息。
    scenarios:
      - name: 显示车次与席别信息
        steps:
          - action: 从车票查询页(P002)携带车次信息进入本页
            expectation: 顶部区域展示所选车次的车次号、出发站/到达站、出发时间/到达时间及历时等信息。
          - action: 页面加载完成
            expectation: 席别区域展示可用席别列表（至少包含二等座、一等座、商务座），每个席别展示余票数量与价格。
      - name: 选择席别
        steps:
          - action: 点击某个可用席别
            expectation: 该席别高亮或标记为已选状态，订单明细区域中的价格按所选席别更新。
          - action: 点击一个已售罄席别
            expectation: 不允许选中该席别或显示无票提示，当前席别选择保持不变。
      - name: 加载常用乘车人并多选
        steps:
          - action: 页面加载完成
            expectation: 乘车人区域展示来自“乘客管理”功能的常用乘车人列表，每个条目显示姓名、证件类型与证件号码、手机号及旅客类型（成人/儿童/学生）。
          - action: 勾选多个乘车人
            expectation: 支持多选乘车人（当前实现未限制上限），每次勾选变更时订单明细区域的乘车人列表与总价实时更新。
      - name: 添加与删除乘车人
        steps:
          - action: 点击“添加乘客”按钮
            expectation: 乘车人区域增加一行可填写的乘客信息输入框。
          - action: 点击乘客信息框最右侧的“删除”图标（仅在2个人及以上时显示）
            expectation: 该乘客信息行从乘车人区域移除，订单明细区域的乘车人列表实时更新。
      - name: 订单明细展示
        steps:
          - action: 选择席别并勾选至少一名乘车人
            expectation: 订单明细区域展示车次信息、乘车人姓名列表与当前计算出的总价；席别信息部分根据当前前端实现可能仅部分展示或通过价格体现。

  - id: F008
    name: 提交订单
    functional_description: 对订单信息进行完整性与合法性校验，检查余票并计算总价，创建订单记录并跳转至个人中心订单管理。
    ui_description: |
      底部区域包含“提交订单”主按钮以及可能的返回/取消操作：
      - 提交前需选择至少一个乘车人和一个有效席别。
      - 提交时触发前后端多重校验。
      - 提交成功后跳转至个人中心(P006)的订单管理模块。
    scenarios:
      - name: 必填项完整性检查
        steps:
          - action: 所给的1个或多个乘车人未填写完整
            expectation: 系统提示“请填写完整乘车人信息”等错误信息，阻止提交，不调用后端接口。
          - action: 所有信息均填写
            expectation: “提交订单”按钮变为可用状态，可发起请求。
      - name: 证件号格式校验
        steps:
          - action: 在乘客管理中存在证件号格式明显不合法的乘车人并尝试提交订单
            expectation: 前端或后端在提交过程中对证件号进行格式检验（如身份证 18 位校验），格式错误时提示用户修正，不创建订单。
      - name: 检查余票并生成订单
        steps:
          - action: 在订单填写页选择席别和乘车人，点击“提交订单”
            expectation: 前端发送订单创建请求，后端根据当前余票情况再次检查席位是否充足。
          - action: 后端确认仍有余票且订单信息合法
            expectation: 后端为本次订单生成唯一订单号，创建订单记录并与所选乘车人信息进行关联，返回成功结果。
          - action: 前端收到成功结果
            expectation: 跳转至个人中心(P006)订单管理页面，并可在订单列表中看到新创建的订单记录。
      - name: 余票不足或校验失败
        steps:
          - action: 在余票不足或后端校验失败的情况下点击“提交订单”
            expectation: 后端返回失败原因（如余票不足或参数错误），前端在本页提示错误信息，不跳转页面且不创建订单。
      - name: 多乘车人价格计算
        steps:
          - action: 选择同一席别的多个乘车人
            expectation: 系统按“席别单价 × 乘车人数”计算总价，并在订单明细区域展示该总价。
          - action: 取消勾选部分乘车人
            expectation: 总价随乘车人数变化实时更新。
