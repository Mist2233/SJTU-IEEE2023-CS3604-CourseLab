groups:
  - name: Auth
    description: "Authentication and Account Management"
    base_path: "/api/auth"
    endpoints:
      - method: POST
        path: /login
        description: "User login with username/email/phone and password."
        source_ref: "backend/routes/auth.js"
        parameters:
          - name: username
            required: true
            type: string
          - name: password
            required: true
            type: string
        response:
          success: boolean
          token: "JWT string (24h expiry)"
          user: object

      - method: POST
        path: /register
        description: "New user registration."
        source_ref: "backend/routes/auth.js"
        parameters:
          - name: username
            required: true
            validation: "^[A-Za-z][A-Za-z0-9_]{5,29}$"
          - name: password
            required: true
            validation: "Length 6-20"
          - name: phone
            required: true
            validation: "^1[3-9]\\d{9}$"
          - name: id_number
            required: true
            validation: "18-digit checksum"
          - name: verificationCode
            required: true
            description: "Must match active code sent to phone."
        logic: "Checks unique username/phone/id. Validates code. Creates user."

      - method: POST
        path: /send-code
        description: "Send SMS verification code for registration."
        source_ref: "backend/routes/auth.js"
        parameters:
          - name: phone
            required: true
            type: string
        logic: "Rate limited (1 min). Generates 6-digit code. Valid 5 mins."

      - method: POST
        path: /forgot/send-code
        description: "Send verification code for password reset."
        source_ref: "backend/routes/auth.js"
        parameters:
          - name: recipient
            required: true
            description: "Phone or Email"
          - name: idNumber
            required: true
            description: "Must match the user's registered ID."
        logic: "Verifies user exists and ID matches before sending code."

      - method: POST
        path: /forgot/reset
        description: "Reset password using verification code."
        source_ref: "backend/routes/auth.js"
        parameters:
          - name: recipient
            required: true
          - name: verificationCode
            required: true
          - name: newPassword
            required: true
        logic: "Verifies code. Updates password."

      - method: GET
        path: /me
        description: "Get current user profile."
        source_ref: "backend/routes/auth.js"
        auth_required: true
        response:
          user: object

      - method: POST
        path: /change-password
        description: "Change current user's password."
        source_ref: "backend/routes/auth.js"
        auth_required: true
        parameters:
          - name: oldPassword
            required: true
          - name: newPassword
            required: true
        logic: "Verifies old password matches current."

  - name: Passengers
    description: "Passenger Management"
    base_path: "/api/passengers"
    endpoints:
      - method: GET
        path: /
        description: "List all passengers for current user."
        source_ref: "backend/routes/passengers.js"
        auth_required: true
        parameters:
          - name: page
            default: 1
          - name: pageSize
            default: 10

      - method: POST
        path: /
        description: "Add a new passenger."
        source_ref: "backend/routes/passengers.js"
        auth_required: true
        parameters:
          - name: name
            required: true
          - name: id_number
            required: true
            validation: "18-digit checksum"
          - name: phone
            required: true

      - method: PUT
        path: /:id
        description: "Update passenger info."
        source_ref: "backend/routes/passengers.js"
        auth_required: true

      - method: DELETE
        path: /:id
        description: "Delete a passenger."
        source_ref: "backend/routes/passengers.js"
        auth_required: true

      - method: POST
        path: /:id/default
        description: "Set passenger as default."
        source_ref: "backend/routes/passengers.js"
        auth_required: true

  - name: UserOrders
    description: "User Order Management"
    base_path: "/api/orders"
    endpoints:
      - method: GET
        path: /user/:userId
        description: "Get order history for a user."
        source_ref: "backend/routes/orders.js"
        auth_required: true
        parameters:
          - name: status
            description: "Filter by PENDING_PAYMENT, PAID, COMPLETED, CANCELLED"
      
      - method: POST
        path: /:orderId/cancel
        description: "Cancel an unpaid order."
        source_ref: "backend/routes/orders.js"
        auth_required: true
        logic: "Only allows cancelling PENDING_PAYMENT orders. Restores stock."

      - method: POST
        path: /:orderId/refund
        description: "Refund a paid order."
        source_ref: "backend/routes/orders.js"
        auth_required: true
        logic: "Only allows refunding PAID orders. Restores stock. Updates status to CANCELLED."
